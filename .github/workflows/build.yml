name: build

# The proprietary Claude binary exists only in the read-only Bionic build job.
# Only explicitly named text reports cross into the write-enabled release job:
#
#   tests   -- x64 regression tests; pull requests stop here.
#   bionic  -- ARM64 runner + pinned termux-docker. Builds, directly executes
#              and renders the Bionic artifact; contents remain read-only.
#   release -- downloads the text reports and publishes credentials only.
#
# dist/claude is a modified copy of Anthropic's proprietary Claude Code and
# must not be redistributed. The release job refuses any asset over 1 MiB,
# which the ~235 MB artifact would trip instantly.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Claude Code version, or latest
        required: true
        default: latest
        type: string
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: claude-code-termux-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      unreleased: ${{ steps.version.outputs.unreleased }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags tell us what is already released
          persist-credentials: false

      - name: Resolve requested Claude Code version
        id: version
        env:
          REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.version || 'latest' }}
        run: |
          set -euo pipefail
          if [ "$REQUESTED" = latest ]; then
            V="$(curl -fsSL --max-time 30 https://downloads.claude.ai/claude-code-releases/latest)"
          else
            V="${REQUESTED#v}"
          fi
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::bad version '$V'"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # An immutable release reserves its tag name forever: a yanked version
          # comes back as v$V-rN, so both forms count as released.
          if git tag -l | grep -qE "^v$V(-r[0-9]+)?$"; then
            echo "unreleased=false" >> "$GITHUB_OUTPUT"
            echo "v$V already has a release"
          else
            echo "unreleased=true" >> "$GITHUB_OUTPUT"
            echo "v$V is unreleased"
          fi

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run regression tests
        run: make test

  bionic:
    needs: [resolve, tests]
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'schedule' || needs.resolve.outputs.unreleased == 'true')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      TERMUX_DOCKER_IMAGE: termux/termux-docker@sha256:66fb9c3f11ed1a5b2096a8e335fdee198567acc09cfe3b2753a6f85f4ef91ead
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build and test inside Bionic Termux
        env:
          CLAUDE_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          docker pull "$TERMUX_DOCKER_IMAGE"
          sudo chmod -R a+rwX "$GITHUB_WORKSPACE"
          docker run --rm --privileged -e CLAUDE_VERSION_INPUT="$CLAUDE_VERSION" -e TERMUX_DOCKER_IMAGE="$TERMUX_DOCKER_IMAGE" -v "$GITHUB_WORKSPACE:/data/data/com.termux/files/home/claude-code-termux" -w /data/data/com.termux/files/home/claude-code-termux "$TERMUX_DOCKER_IMAGE" bash .github/ci/bionic-build.sh

      - name: Verify Bionic acceptance manifest
        env:
          EXPECTED_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          with open("dist/build-manifest.json") as f:
              doc = json.load(f)
          expected = os.environ["EXPECTED_VERSION"]
          assert doc["claude"] == expected, doc
          assert doc["output_version"].startswith(expected), doc
          assert doc["tui_smoke"]["ran"] is True, doc
          assert doc["tui_smoke"]["result"] == "pass", doc
          assert doc["ci_acceptance"]["runtime"] == "termux-docker/bionic", doc
          assert doc["ci_acceptance"]["architecture"] == "aarch64", doc
          assert doc["ci_acceptance"]["version_probe"] == "pass", doc
          print(json.dumps(doc, indent=2))
          PY

      - name: Upload Bionic reports (no binary)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-reports
          path: |
            dist/build-manifest.json
            work/extract-report.json
            work/native-abi.json
            work/adapt-report.json
            work/adapt-report.log
            work/embed-preload.json
            work/embed-preload.log
            work/verify-graft.json
            work/revive-report.log
            work/tui-smoke.json
            work/tui-smoke.log
            work/bionic-ci.txt
          retention-days: 7
          if-no-files-found: error

  release:
    needs: [resolve, bionic]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.resolve.outputs.version }}
      UNRELEASED: ${{ needs.resolve.outputs.unreleased }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-reports
          path: reports

      - name: Cut toolchain release if scripts/ or tools/ changed
        id: toolchain
        run: |
          set -euo pipefail

          # Fingerprint = sha256 over the sorted per-file sha256 of the whole
          # toolchain. Putting it in the tag makes the version stateless: if the
          # bytes changed, no tag matches and a new release is cut; otherwise we
          # skip. Nothing to remember to bump, so it cannot drift.
          #
          # git ls-files, not find: find also picks up stray untracked files
          # (__pycache__ and friends), so the same commit would hash differently
          # on a machine that had run the tools. `make fingerprint` prints the
          # same number locally.
          #
          # .github/ is in the set because it decides what a release *says*: a
          # change to the note generator that stayed outside the fingerprint
          # would ship with no tag recording it.
          TC_PATHS="scripts tools .github"
          TC_FP="$(git ls-files -z $TC_PATHS | sort -z \
                    | xargs -0 sha256sum | sha256sum | cut -c1-7)"
          echo "fingerprint: $TC_FP"

          TC_TAG="$(git tag -l "toolchain-v*-$TC_FP" | head -1)"
          if [ -n "$TC_TAG" ]; then
            echo "already released as $TC_TAG"
          else
            N="$(git tag -l 'toolchain-v*' \
                 | sed -n 's|^toolchain-v\([0-9]*\)-.*|\1|p' | sort -n | tail -1)"
            N=$(( ${N:-0} + 1 ))
            PREV="$(git tag -l 'toolchain-v*' | sort -V | tail -1)"
            PREV="${PREV:--}"
            TC_TAG="toolchain-v$N-$TC_FP"

            if [ "$PREV" != "-" ]; then
              git log --oneline --no-decorate "$PREV..HEAD" -- $TC_PATHS > changelog.txt
            else
              git log --oneline --no-decorate -20 -- $TC_PATHS > changelog.txt
            fi
            RELEASED="$(git tag -l 'v*' \
                        | sed -E -n 's|^v([0-9][0-9.]*)(-r[0-9]+)?$|\1|p' \
                        | sort -uV | paste -sd, -)"

            # This tag is cut before the Claude release of the same run (that note
            # needs it), and `gh release create` publishes its tag through the API,
            # so this checkout never learns about it: without --pending the list
            # below would be missing the version released seconds later.
            PENDING=""
            if [ "$UNRELEASED" = "true" ]; then PENDING="$VERSION"; fi

            python3 .github/release_notes.py toolchain tc-notes.md \
              --toolchain "$TC_TAG" --fingerprint "$TC_FP" \
              --predecessor "$PREV" --changelog changelog.txt --released "$RELEASED" \
              --pending "$PENDING" --paths "$TC_PATHS" \
              --versions versions.json

            # --latest=false: a toolchain tag is not a newer version of the thing
            # people come here for, and /releases/latest has to keep resolving to
            # the Claude Code release. Without it GitHub marks the newest release
            # as Latest, which for a same-run pair is this one.
            gh release create "$TC_TAG" --title "工具链 v$N ($TC_FP)" \
              --latest=false --notes-file tc-notes.md
            echo "released $TC_TAG"
          fi

          echo "tag=$TC_TAG" >> "$GITHUB_OUTPUT"

      - name: Cut Claude Code release if the version is new
        if: needs.resolve.outputs.unreleased == 'true'
        run: |
          set -euo pipefail

          python3 .github/release_notes.py claude claude-notes.md \
            --manifest reports/dist/build-manifest.json \
            --versions versions.json \
            --toolchain "${{ steps.toolchain.outputs.tag }}"

          # Credentials only. Every asset must be small text; the guard is what
          # keeps a future edit from quietly attaching dist/claude (~235 MB).
          ASSETS="reports/dist/build-manifest.json
          reports/work/extract-report.json
          reports/work/native-abi.json
          reports/work/adapt-report.json
          reports/work/adapt-report.log
          reports/work/embed-preload.json
          reports/work/embed-preload.log
          reports/work/verify-graft.json
          reports/work/revive-report.log
          reports/work/tui-smoke.json
          reports/work/tui-smoke.log
          reports/work/bionic-ci.txt"
          for f in $ASSETS; do
            [ -f "$f" ] || { echo "::error::missing asset $f"; exit 1; }
            sz="$(stat -c%s "$f")"
            if [ "$sz" -gt 1048576 ]; then
              echo "::error::$f is $sz bytes; releases carry credentials, not binaries"
              exit 1
            fi
          done

          # An immutable release permanently reserves its tag name, so a yanked
          # version can never be re-cut as v$VERSION. Attempt it anyway and, if
          # the API rejects the burned name, cut the next free v$VERSION-rN.
          TAG="v$VERSION"
          TITLE="Claude Code $VERSION · Termux"
          set +e
          OUT="$(gh release create "$TAG" --title "$TITLE" \
            --notes-file claude-notes.md $ASSETS 2>&1)"
          RC=$?
          set -e
          if [ "$RC" != "0" ]; then
            if ! printf '%s' "$OUT" | grep -q 'immutable release'; then
              printf '%s\n' "$OUT" >&2
              exit "$RC"
            fi
            N=1
            while git ls-remote --tags origin "refs/tags/v$VERSION-r$N" | grep -q .; do
              N=$((N+1))
            done
            TAG="v$VERSION-r$N"
            TITLE="Claude Code $VERSION · Termux (r$N)"
            echo "v$VERSION is reserved by an immutable release; re-cutting as $TAG"
            gh release create "$TAG" --title "$TITLE" \
              --notes-file claude-notes.md $ASSETS
          fi
          echo "released $TAG"
