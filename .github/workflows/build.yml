name: build

# The proprietary Claude binary exists only in the read-only Bionic build job.
# Only explicitly named text reports cross into the write-enabled release job:
#
#   resolve -- picks the Claude version and the release tag (vX.Y.Z, or
#              vX.Y.Z-rN for a manual re-cut after toolchain changes) and
#              decides whether anything new needs to be released.
#   tests   -- x64 regression tests; pull requests stop here.
#   bionic  -- ARM64 runner + pinned termux-docker. Builds, directly executes
#              and renders the Bionic artifact; contents remain read-only.
#   release -- downloads the text reports and publishes credentials only.
#
# Toolchain changes are not released on their own: they ship with the next
# Claude version, or now via workflow_dispatch with recut=true. See docs/ci.md.
#
# dist/claude is a modified copy of Anthropic's proprietary Claude Code and
# must not be redistributed. The release job refuses any asset over 1 MiB,
# which the ~235 MB artifact would trip instantly.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Claude Code version, or latest
        required: true
        default: latest
        type: string
      recut:
        description: Re-release an already released version (toolchain changed)
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: claude-code-termux-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      unreleased: ${{ steps.version.outputs.unreleased }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags tell us what is already released
          persist-credentials: false

      - name: Resolve requested Claude Code version
        id: version
        env:
          REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.version || 'latest' }}
          RECUT: ${{ github.event_name == 'workflow_dispatch' && inputs.recut || 'false' }}
        run: |
          set -euo pipefail
          if [ "$REQUESTED" = latest ]; then
            V="$(curl -fsSL --max-time 30 https://downloads.claude.ai/claude-code-releases/latest)"
          else
            V="${REQUESTED#v}"
          fi
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::bad version '$V'"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # An immutable release reserves its tag name forever, so a re-cut
          # (or a yanked release) becomes v$V-rN; both forms count as released.
          TAGS="$(git tag -l)"
          if grep -qE "^v$V(-r[0-9]+)?$" <<<"$TAGS"; then
            if [ "$RECUT" = true ]; then
              N=1
              while grep -qx "v$V-r$N" <<<"$TAGS"; do N=$((N+1)); done
              echo "tag=v$V-r$N" >> "$GITHUB_OUTPUT"
              echo "unreleased=true" >> "$GITHUB_OUTPUT"
              echo "re-cutting v$V as v$V-r$N"
            else
              echo "tag=v$V" >> "$GITHUB_OUTPUT"
              echo "unreleased=false" >> "$GITHUB_OUTPUT"
              echo "v$V already has a release"
            fi
          else
            echo "tag=v$V" >> "$GITHUB_OUTPUT"
            echo "unreleased=true" >> "$GITHUB_OUTPUT"
            echo "v$V is unreleased"
          fi

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run regression tests
        run: python3 -m unittest discover -s tests -v

  bionic:
    needs: [resolve, tests]
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'schedule' || needs.resolve.outputs.unreleased == 'true')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      TERMUX_DOCKER_IMAGE: termux/termux-docker@sha256:66fb9c3f11ed1a5b2096a8e335fdee198567acc09cfe3b2753a6f85f4ef91ead
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build and test inside Bionic Termux
        env:
          CLAUDE_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          docker pull "$TERMUX_DOCKER_IMAGE"
          sudo chmod -R a+rwX "$GITHUB_WORKSPACE"
          docker run --rm --privileged -e CLAUDE_VERSION_INPUT="$CLAUDE_VERSION" -e TERMUX_DOCKER_IMAGE="$TERMUX_DOCKER_IMAGE" -v "$GITHUB_WORKSPACE:/data/data/com.termux/files/home/claude-code-termux" -w /data/data/com.termux/files/home/claude-code-termux "$TERMUX_DOCKER_IMAGE" bash .github/ci/bionic-build.sh

      - name: Verify Bionic acceptance manifest
        env:
          EXPECTED_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          with open("dist/build-manifest.json") as f:
              doc = json.load(f)
          expected = os.environ["EXPECTED_VERSION"]
          assert doc["claude"] == expected, doc
          assert doc["output_version"].startswith(expected), doc
          assert doc["tui_smoke"]["ran"] is True, doc
          assert doc["tui_smoke"]["result"] == "pass", doc
          assert doc["ci_acceptance"]["runtime"] == "termux-docker/bionic", doc
          assert doc["ci_acceptance"]["architecture"] == "aarch64", doc
          assert doc["ci_acceptance"]["version_probe"] == "pass", doc
          print(json.dumps(doc, indent=2))
          PY

      - name: Upload Bionic reports (no binary)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-reports
          path: |
            dist/build-manifest.json
            work/extract-report.json
            work/native-abi.json
            work/adapt-report.json
            work/adapt-report.log
            work/embed-preload.json
            work/runtime.json
            work/embed-preload.log
            work/verify-graft.json
            work/revive-report.log
            work/tui-smoke.json
            work/tui-smoke.log
            work/bionic-ci.txt
          retention-days: 7
          if-no-files-found: error

  release:
    needs: [resolve, bionic]
    if: needs.resolve.outputs.unreleased == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.resolve.outputs.version }}
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-reports
          path: reports

      - name: Publish release
        run: |
          set -euo pipefail

          # Credentials only. Every asset must be small text; the guard is what
          # keeps a future edit from quietly attaching dist/claude (~250 MB).
          ASSETS="reports/dist/build-manifest.json
          reports/work/extract-report.json
          reports/work/native-abi.json
          reports/work/adapt-report.json
          reports/work/adapt-report.log
          reports/work/embed-preload.json
          reports/work/runtime.json
          reports/work/embed-preload.log
          reports/work/verify-graft.json
          reports/work/revive-report.log
          reports/work/tui-smoke.json
          reports/work/tui-smoke.log
          reports/work/bionic-ci.txt"
          for f in $ASSETS; do
            [ -f "$f" ] || { echo "::error::missing asset $f"; exit 1; }
            sz="$(stat -c%s "$f")"
            if [ "$sz" -gt 1048576 ]; then
              echo "::error::$f is $sz bytes; releases carry credentials, not binaries"
              exit 1
            fi
          done

          # Toolchain changes since the previous release, for the notes.
          PREV="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$GITHUB_SHA" 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            git log --oneline --no-decorate "$PREV..$GITHUB_SHA" -- . \
              ':(exclude)docs' ':(exclude)tests' ':(exclude)*.md' > changelog.txt
          else
            : > changelog.txt
          fi

          # /releases/latest is what `claude update` follows. Only the highest
          # Claude version may hold it, so re-cutting an older version cannot
          # roll every installation back.
          HIGHEST="$(git tag -l 'v*' | sed -nE 's/^v([0-9]+\.[0-9]+\.[0-9]+)(-r[0-9]+)?$/\1/p' \
                     | sort -V | tail -1)"
          LATEST=true
          if [ -n "$HIGHEST" ] && [ "$(printf '%s\n%s\n' "$HIGHEST" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]; then
            LATEST=false
          fi

          # --target pins the tag to the commit this run built: `claude update`
          # rebuilds from that tag and requires the same binary hash.
          publish() {
            python3 .github/release_notes.py claude-notes.md \
              --manifest reports/dist/build-manifest.json --tag "$1" \
              --commit "$GITHUB_SHA" --predecessor "${PREV:--}" --changelog changelog.txt
            title="Claude Code $VERSION · Termux"
            case "$1" in *-r*) title="$title (${1##*-})" ;; esac
            gh release create "$1" --target "$GITHUB_SHA" --latest="$LATEST" \
              --title "$title" --notes-file claude-notes.md $ASSETS
          }

          # A deleted immutable release still reserves its tag name. If the API
          # rejects the name, take the next free v$VERSION-rN.
          set +e
          OUT="$(publish "$TAG" 2>&1)"
          RC=$?
          set -e
          printf '%s\n' "$OUT"
          if [ "$RC" != "0" ]; then
            if ! printf '%s' "$OUT" | grep -q 'immutable release'; then
              exit "$RC"
            fi
            N=1
            while git ls-remote --tags origin "refs/tags/v$VERSION-r$N" | grep -q .; do
              N=$((N+1))
            done
            echo "$TAG is reserved by an immutable release; re-cutting as v$VERSION-r$N"
            TAG="v$VERSION-r$N"
            publish "$TAG"
          fi
          echo "released $TAG"
